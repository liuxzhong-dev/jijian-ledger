# 分析器配置：不引入 flutter_lints 包（少一个依赖，少一处版本冲突）。
# 只开几条真正有用的规则，其余交给编译器。

analyzer:
  exclude:
    - build/**
    - android/**
  errors:
    # 未使用的 import / 局部变量当成警告就好，不要卡住构建
    unused_import: warning
    unused_local_variable: warning

linter:
  rules:
    - avoid_print
    - use_key_in_widget_constructors
